    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #0a0a0a;
      font: 600 1.0625rem/1.55 "Nunito Sans Logo", system-ui, sans-serif;
    }
    .page { width: min(100% - 3rem, 52rem); margin-inline: auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.25rem;
      border-bottom: 1px solid #d5d8dc;
    }
    .logo-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 5.75rem;
      height: 6.25rem;
      overflow: hidden;
    }
    .logo-frame img {
      display: block;
      width: 11rem;
      height: 11rem;
      max-width: none;
      flex: none;
    }
    .towns { margin: 0; text-align: right; color: #484e55; font-weight: 700; }
    main { max-width: 43rem; padding-block: clamp(2rem, 7vw, 4.25rem); }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7.5vw, 4.75rem);
      font-weight: 900;
      line-height: 1.03;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }
    .offer { margin: 1.35rem 0 0; font-size: clamp(1.25rem, 2.8vw, 1.65rem); }
    .scope { margin-block: 0.8rem 0; max-width: 37rem; color: #444a50; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 1.8rem; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #405e85; outline-offset: 4px; }
    .text-button, .call { display: inline-flex; min-height: 48px; align-items: center; }
    .text-button { padding: .7rem 1.25rem; background: #0a0a0a; color: #fff; border-radius: 8px; font-weight: 800; text-decoration: none; }
    .text-button:hover { background: #333; }
    .call { text-decoration-thickness: 1px; text-underline-offset: 3px; }
    @media (max-width: 30rem) {
      .page { width: calc(100% - 2.5rem); }
      header { padding-block: .65rem; }
      .towns { font-size: .9375rem; }
      .actions { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 22rem) {
      .logo-frame { width: 4.2rem; height: 4.6rem; }
      .logo-frame img { width: 8rem; height: 8rem; }
      main { padding-block: 1.5rem; }
      .actions { margin-top: 1.25rem; }
    }
  </style>
